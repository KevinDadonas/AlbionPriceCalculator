<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="todosItensCaerleon.js" defer></script>
  <title>Albion Market Monitor</title>
  <!-- CDN do Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="style.css">
  <!-- Fonte Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0f0e13] text-gray-200 font-['Inter'] antialiased min-h-screen p-6 h-screen overflow-hidden">

  <div class="max-w-7xl mx-auto space-y-6">

    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold text-gray-100">Albion Market Monitor</h2>
      
      <button 
        id="btnToggleMonitor" 
        onclick="alternarMonitoramento()" 
        class="flex items-center gap-2 px-4 py-2 rounded-lg font-semibold text-xs transition-all bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-950/40 cursor-pointer">
        <span id="iconeBtn">▶</span>
        <span id="textoBtn">Iniciar Monitoramento</span>
      </button>
  </div>
    
    <!-- Tabela Principal -->
    <div class="bg-[#18161e] rounded-xl border border-gray-800/60 shadow-xl overflow-hidden">
      <div class="overflow-x-auto overflow-y-auto max-h-[100vh] "> <!--É só adicionar a classe 'no-scrollbar' para ocultar a scrollbar-->
        <table class="w-full text-left text-sm border-collapse">
          <thead class="sticky top-0 z-10 bg-[#131218]">
            <tr class="border-b border-gray-800/80 text-xs font-semibold text-gray-400 uppercase tracking-wider bg-[#131218]">
              <th class="py-3.5 px-4">Item</th>
              <th class="py-3.5 px-4">Cidade</th>
              <th class="py-3.5 px-4">Qualidade</th>
              <th class="py-3.5 px-4">Encantamento</th>
              <th class="py-3.5 px-4 text-right">Compra</th>
              <th class="py-3.5 px-4 text-right">Venda direta</th>
              <th class="py-3.5 px-4 text-center">Chance de Mercado</th>
              <th class="py-3.5 px-4 text-right cursor-pointer text-amber-500">Lucro</th>
              <th class="py-3.5 px-4 text-right">Margem</th>
              <th class="py-3.5 px-4 text-right">Atualização</th>
            </tr>
          </thead>
          <tbody id="tabelaCorpo" class="divide-y divide-gray-800/40 text-xs font-medium">
            
          </tbody>
        </table>
      </div>
    </div>

  </div>

</body>
</html>
